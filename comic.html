<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SamBox Comic</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="top-bar">

<div class="logo">
<img src="images/sambox-logo.png" alt="SamBox">
</div>

<div class="menu-btn">
☰
</div>

</div>

<nav>

<a href="index.html">الرئيسية</a>

<a href="comics.html">جميع الكوميكس</a>

<a href="comics.html#search">🔎 البحث</a>

<a href="favorites.html">💛 المفضلة</a>
    
<a href="contact.html">تواصل معنا</a>

</nav>

</header>

<section class="popular">

<div class="card" style="width:800px;max-width:95%;margin:140px auto 50px;">

<div class="cover" style="height:420px;">
<img id="cover" src="">
</div>

<h1 id="title" style="color:#ffd000;"></h1>

<p>
<b>الحالة:</b>
<span id="status"></span>
</p>

<p>
<b>عدد الأعداد:</b>
<span id="issues"></span>
</p>

<p>
<b>نبذة:</b>
</p>

<p id="description"></p>

<br>

<div id="buttons"></div>
<button id="favoriteBtn" class="favorite-btn">
<svg class="heart-icon" viewBox="0 0 24 24">
<path d="M12 21s-7-4.4-9.5-8C.4 10.2 1.2 5.8 5.2 4.6c2-.6 4 .2 5.3 2 1.3-1.8 3.3-2.6 5.3-2 4 1.2 4.8 5.6 2.7 8.4C19 16.6 12 21 12 21z"/>
</svg>

<span>إضافة إلى المفضلة</span>

</button>
</div>

</section>

<script>

const params = new URLSearchParams(location.search);

const comic = params.get("comic");

fetch(`comics/${comic}/info.json`)

.then(r=>r.json())

.then(info=>{

document.getElementById("title").textContent=info.title;

document.getElementById("status").textContent=info.status;

document.getElementById("description").textContent=info.description;

document.getElementById("issues").textContent=info.issues;

document.getElementById("cover").src=`comics/${comic}/cover.jpg`;

let html="";

for(let i=1;i<=info.issues;i++){

html+=`
<a href="reader.html?comic=${comic}&issue=${i}">
<button>العدد ${i}</button>
</a>
`;

}

document.getElementById("buttons").innerHTML=html;

});

const menu=document.querySelector(".menu-btn");
const nav=document.querySelector("nav");

menu.onclick=()=>nav.classList.toggle("show");

</script>
<script>

const favoriteBtn = document.getElementById("favoriteBtn");

const comicTitle = document.querySelector("h1").textContent;

let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

function updateFavorite(){

    const exists = favorites.some(comic => comic.title === comicTitle);

    if(exists){

        favoriteBtn.classList.add("saved");
        favoriteBtn.querySelector("span").textContent = "إزالة من المفضلة";

    }else{

        favoriteBtn.classList.remove("saved");
        favoriteBtn.querySelector("span").textContent = "إضافة إلى المفضلة";

    }

}


favoriteBtn.addEventListener("click",()=>{

    const index = favorites.findIndex(comic => comic.title === comicTitle);


    if(index === -1){

        favorites.push({
    title: document.getElementById("title").textContent,
    folder: comic,
    cover: document.getElementById("cover").src
});
    }else{

        favorites.splice(index,1);

    }


    localStorage.setItem("favorites",JSON.stringify(favorites));

    updateFavorite();

});


updateFavorite();


</script>
</body>

</html>
