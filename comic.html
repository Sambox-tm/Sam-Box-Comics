<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SamBox Comic</title>

<link rel="stylesheet" href="style.css">
<style>

.reader-controls{
display:flex;
justify-content:center;
align-items:center;
margin-top:20px;
position:relative;
}

.issues-button{
width:auto;
padding:10px 25px;
font-size:16px;
margin:0;
}

.issues-menu{
display:none;
position:fixed;
left:50%;
transform:translateX(-50%);
margin-top:15px;
background:#111;
border:2px solid #ffd000;
border-radius:15px;
padding:10px;
width:220px;
z-index:99999;
box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.issues-menu a{
display:block;
color:white;
text-decoration:none;
padding:12px;
border-bottom:1px solid #333;
transition:.3s;
}

.issues-menu a:last-child{
border-bottom:none;
}

.issues-menu a:hover{
background:#222;
color:#ffd000;
}

</style>
</head>

<body>


<header>

<div class="top-bar">

<div class="logo">
<img src="images/sambox-logo.png" alt="SamBox">
</div>

<div class="menu-btn">
☰
</div>

</div>


<nav>

<a href="index.html">الرئيسية</a>

<a href="comics.html">جميع الكوميكس</a>

<a href="comics.html#search">🔎 البحث</a>

<a href="favorites.html">💛 المفضلة</a>

<a href="contact.html">تواصل معنا</a>

  <a href="#" onclick="shareSite()">

<svg class="share-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
<path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.03-.47-.09-.7l7.05-4.11A2.99 2.99 0 0 0 18 7.92a3 3 0 1 0-3-3c0 .24.03.47.09.7L8.04 9.73A3 3 0 1 0 8 14.27l7.05 4.11c-.05.21-.08.43-.08.65a3 3 0 1 0 3-3z"/>
</svg>

مشاركة الموقع

  </a>
  
</nav>

</header>



<section class="popular">


<div class="card" style="width:800px;max-width:95%;margin:140px auto 50px;overflow:visible;">

<div class="cover" style="height:420px;">
<img id="cover" src="">
</div>


<h1 id="title" style="color:#ffd000;"></h1>


<p>
<b>الحالة:</b>
<span id="status"></span>
</p>


<p>
<b>عدد الأعداد:</b>
<span id="issues"></span>
</p>


<p>
<b>نبذة:</b>
</p>


<p id="description"></p>


<br>


<div class="reader-controls">

<button id="issuesButton" class="issues-button">
📚 الأعداد
</button>

<div id="issuesMenu" class="issues-menu"></div>

</div>

<button id="favoriteBtn" class="favorite-btn">

<svg class="heart-icon" viewBox="0 0 24 24">

<path d="M12 21s-7-4.4-9.5-8C.4 10.2 1.2 5.8 5.2 4.6c2-.6 4 .2 5.3 2 1.3-1.8 3.3-2.6 5.3-2 4 1.2 4.8 5.6 2.7 8.4C19 16.6 12 21 12 21z"/>

</svg>


<span>إضافة إلى المفضلة</span>


</button>


</div>


</section>



<script>


const params = new URLSearchParams(location.search);

const comic = params.get("comic");



fetch(`comics/${comic}/info.json`)

.then(r=>r.json())

.then(info=>{


document.getElementById("title").textContent = info.title;


document.getElementById("status").textContent = info.status;


document.getElementById("description").textContent = info.description;


document.getElementById("issues").textContent = info.issues;


document.getElementById("cover").src = `comics/${comic}/cover.jpg`;



let html = "";
const issuesButton = document.getElementById("issuesButton");
const issuesMenu = document.getElementById("issuesMenu");

let menuHTML = "";

for(let i=1;i<=info.issues;i++){

menuHTML += `
<a href="reader.html?comic=${comic}&issue=${i}">
العدد ${i}
</a>
`;

}

issuesMenu.innerHTML = menuHTML;

issuesButton.onclick = () => {

issuesMenu.style.display =
issuesMenu.style.display === "block"
? "none"
: "block";

};


updateFavorite();


});




const menu=document.querySelector(".menu-btn");

const nav=document.querySelector("nav");


menu.onclick=()=>nav.classList.toggle("show");



</script>




<script>


const favoriteBtn = document.getElementById("favoriteBtn");


let favorites = JSON.parse(localStorage.getItem("favorites")) || [];



function updateFavorite(){


const exists = favorites.some(item => item.folder === comic);



if(exists){


favoriteBtn.classList.add("saved");


favoriteBtn.querySelector("span").textContent = "إزالة من المفضلة";


}else{


favoriteBtn.classList.remove("saved");


favoriteBtn.querySelector("span").textContent = "إضافة إلى المفضلة";


}


}




favoriteBtn.addEventListener("click",()=>{


const index = favorites.findIndex(item => item.folder === comic);



if(index === -1){


favorites.push({

title: document.getElementById("title").textContent,

folder: comic,

cover: document.getElementById("cover").src

});


}else{


favorites.splice(index,1);


}



localStorage.setItem("favorites",JSON.stringify(favorites));


updateFavorite();



});




</script>
<script>

function shareSite(){

const url = "https://sambox-tm.github.io/Sam-Box-Comics/";

if(navigator.share){

navigator.share({

title:"SamBox Comics",

text:"اقرأ أفضل الكوميكس المترجمة من SamBox 🔥",

url:url

});

}else{

navigator.clipboard.writeText(url);

alert("تم نسخ رابط الموقع");

}

}

</script>

</body>

</html>
