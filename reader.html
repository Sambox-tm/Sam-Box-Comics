<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SamBox Reader</title>
<link rel="stylesheet" href="style.css">

<style>

.reader-card{
    width:800px;
    max-width:95%;
    margin:auto;
    padding:25px;
}

.reader-buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-top:30px;
}

.reader-buttons a{
    text-decoration:none;
}

.reader-error{
    text-align:center;
    padding:40px 20px;
}

.reader-error h1{
    color:#ffd000;
    margin-bottom:20px;
}


.reader-controls{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:20px;

    flex-wrap:wrap;

}


.issues-button{

    width:auto;

    padding:10px 25px;

    font-size:16px;

    margin:0;

}
.issues-menu{

    display:none;

    margin:15px auto;

    background:#111;

    border:2px solid #ffd000;

    border-radius:15px;

    padding:15px;

    width:220px;

    position:relative;

    z-index:99999;

}
.reader-top{
    position:relative;
    z-index:10;
}

.issues-menu a{

    display:block;

    color:white;

    text-decoration:none;

    padding:10px;

    border-bottom:1px solid #333;

}


.issues-menu a:hover{

    color:#ffd000;

}

</style>
</head>

<body>

<header>
    <div class="top-bar">

    <div class="logo">
        <img src="images/sambox-logo.png" alt="SamBox">
    </div>

    <div class="menu-btn">☰</div>

    </div>

    <nav>

<a href="index.html">الرئيسية</a>

<a href="comics.html">جميع الكوميكس</a>

<a href="comics.html#search">🔎 البحث</a>

<a href="favorites.html">💛 المفضلة</a>

<a href="contact.html">تواصل معنا</a>

<a href="#" onclick="shareSite()">

<svg class="share-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
<path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.03-.47-.09-.7l7.05-4.11A2.99 2.99 0 0 0 18 7.92a3 3 0 1 0-3-3c0 .24.03.47.09.7L8.04 9.73A3 3 0 1 0 8 14.27l7.05 4.11c-.05.21-.08.43-.08.65a3 3 0 1 0 3-3z"/>
</svg>

مشاركة الموقع

</a>

    </nav>
</header>
    
<section class="reader">
    <div class="reader-top">

<h1 id="comicTitle" style="color:#ffd000;"></h1>

<div class="reader-controls">

<h2 id="issueTitle" style="color:#ddd;"></h2>

<button id="downloadBtn" class="download-btn">
⬇️ تحميل العدد
</button>
    
<button id="issuesButton" class="issues-button">
📚 الأعداد
</button>

<div id="issuesMenu" class="issues-menu"></div>

</div>

    </div>

<div class="pages" id="pages"></div>

        <div class="reader-buttons">
            <a id="backLink" href="comics.html">
                <button>⬅ العودة للكوميكس</button>
            </a>

            <a id="prevLink" href="#" style="display:none;">
                <button>⬅ العدد السابق</button>
            </a>

            <a id="nextLink" href="#" style="display:none;">
                <button>العدد التالي ➡</button>
            </a>
        </div>
    </div>
</section>

<script>
const menu = document.querySelector(".menu-btn");
const nav = document.querySelector("nav");

menu.onclick = () => {
    nav.classList.toggle("show");
};

function showError(message) {
    document.querySelector(".reader").innerHTML = `
        <div class="reader-error">
            <h1>${message}</h1>
            <a href="comics.html"><button>العودة إلى جميع الكوميكس</button></a>
        </div>
    `;
}

(async function initReader() {
    const params = new URLSearchParams(location.search);
    const comic = params.get("comic");
    const issue = parseInt(params.get("issue") || "1", 10);

    if (!comic) {
        showError("لم يتم تحديد الكوميكس.");
        return;
    }

    const comicName = decodeURIComponent(comic);
    const comicPath = `comics/${comicName}`;
    const issuePath = `${comicPath}/issue-${issue}`;

    try {
        const infoRes = await fetch(`${comicPath}/info.json`);
        if (!infoRes.ok) throw new Error("info missing");
        const info = await infoRes.json();

        const pagesRes = await fetch(`${issuePath}/pages.json`);
        if (!pagesRes.ok) throw new Error("pages missing");
        const pagesInfo = await pagesRes.json();

        const pageCount = Number(pagesInfo.pages || 0);
        if (!pageCount) throw new Error("empty pages count");

        document.title = `${info.title} - العدد ${issue} | SamBox`;
        document.getElementById("comicTitle").textContent = info.title;
        document.getElementById("issueTitle").textContent = `العدد ${issue}`;
        const issuesButton = document.getElementById("issuesButton");
const issuesMenu = document.getElementById("issuesMenu");

issuesButton.onclick = () => {

issuesMenu.style.display =
issuesMenu.style.display === "block"
? "none"
: "block";

};


let menuHTML = "";

for (let i = 1; i <= info.issues; i++) {
    menuHTML += `
        <a href="reader.html?comic=${encodeURIComponent(comicName)}&issue=${i}">
            العدد ${i}
        </a>
    `;
}

issuesMenu.innerHTML = menuHTML;
        document.getElementById("backLink").href = `comic.html?comic=${encodeURIComponent(comicName)}`;

        let html = "";
        for (let i = 1; i <= pageCount; i++) {
            html += `<img src="${issuePath}/page-${i}.jpg" alt="صفحة ${i}">`;
        }
        document.getElementById("pages").innerHTML = html;

        const prevLink = document.getElementById("prevLink");
        if (issue > 1) {
            prevLink.href = `reader.html?comic=${encodeURIComponent(comicName)}&issue=${issue - 1}`;
            prevLink.style.display = "inline-block";
        }

        const nextIssue = issue + 1;
        const nextRes = await fetch(`${comicPath}/issue-${nextIssue}/pages.json`);
        if (nextRes.ok) {
            const nextLink = document.getElementById("nextLink");
            nextLink.href = `reader.html?comic=${encodeURIComponent(comicName)}&issue=${nextIssue}`;
            nextLink.style.display = "inline-block";
        }
        const downloadBtn = document.getElementById("downloadBtn");

downloadBtn.onclick = async () => {

    const zip = new JSZip();

    for(let i = 1; i <= pageCount; i++){

        const response = await fetch(`${issuePath}/page-${i}.jpg`);

        const blob = await response.blob();

        zip.file(`page-${i}.jpg`, blob);

    }


    const file = await zip.generateAsync({
        type:"blob"
    });


    const link = document.createElement("a");

    link.href = URL.createObjectURL(file);

    link.download = `${info.title}-العدد-${issue}.zip`;

    link.click();

};
    } catch (e) {
        showError("تعذر تحميل صفحات العدد.");
    }
})();
</script>
<script>

function shareSite(){

const url = "https://sambox-tm.github.io/Sam-Box-Comics/";

if(navigator.share){

navigator.share({

title:"SamBox Comics",

text:"اقرأ أفضل الكوميكس المترجمة من SamBox 🔥",

url:url

});

}else{

navigator.clipboard.writeText(url);

alert("تم نسخ رابط الموقع");

}

}

</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</body>
</html>
