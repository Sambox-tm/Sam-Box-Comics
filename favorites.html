<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>المفضلة - SamBox</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="top-bar">

<div class="logo">
<img src="images/sambox-logo.png" alt="SamBox">
</div>

<div class="menu-btn">
☰
</div>

</div>


<nav>

<a href="index.html">الرئيسية</a>

<a href="comics.html">جميع الكوميكس</a>

<a href="comics.html#search">🔎 البحث</a>

<a href="favorites.html">💛 المفضلة</a>

<a href="contact.html">تواصل معنا</a>

  <a href="#" onclick="shareSite()">

<svg class="share-icon" viewBox="0 0 24 24">
<path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.03-.47-.09-.7l7.05-4.11A2.99 2.99 0 0 0 18 7.92a3 3 0 1 0-3-3c0 .24.03.47.09.7L8.04 9.73A3 3 0 1 0 8 14.27l7.05 4.11c-.05.21-.08.43-.08.65a3 3 0 1 0 3-3z"/>
</svg>

مشاركة الموقع

  </a>
  
</nav>

</header>



<section class="popular">

<h2>
 الكوميكس المفضلة
</h2>


<div class="comics" id="favoritesList">


</div>


</section>



<script>


const menu=document.querySelector(".menu-btn");
const nav=document.querySelector("nav");

menu.onclick=()=>nav.classList.toggle("show");



let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

const container = document.getElementById("favoritesList");


if(favorites.length === 0){

container.innerHTML = `
<h2 style="color:white;">
لا توجد كوميكس في المفضلة
</h2>
`;

}else{


favorites.forEach(comic=>{


container.innerHTML += `

<a href="comic.html?comic=${comic.folder}" class="comic-link">

<div class="card">


<div class="cover">


<img src="${comic.cover}" alt="${comic.title}">


<div class="favorite-mark">
💛
</div>


</div>


<h3>
${comic.title}
</h3>


</div>


</a>

`;


});


}


</script>

<script>

function shareSite(){

const url = "https://sambox-tm.github.io/Sam-Box-Comics/";

if(navigator.share){

navigator.share({

title:"SamBox Comics",

text:"اقرأ أفضل الكوميكس المترجمة من SamBox 🔥",

url:url

});

}else{

navigator.clipboard.writeText(url);

alert("تم نسخ رابط الموقع");

}

}

</script>

</body>

</html>
