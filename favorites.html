<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>المفضلة - SamBox</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="top-bar">

<div class="logo">
<img src="images/sambox-logo.png" alt="SamBox">
</div>

<div class="menu-btn">
☰
</div>

</div>


<nav>

<a href="index.html">الرئيسية</a>

<a href="comics.html">جميع الكوميكس</a>

<a href="comics.html#search">🔎 البحث</a>

<a href="favorites.html">💛 المفضلة</a>

<a href="contact.html">تواصل معنا</a>

</nav>

</header>



<section class="popular">

<h2>
💛 الكوميكس المفضلة
</h2>


<div class="comics" id="favoritesList">


</div>


</section>



<script>


const menu=document.querySelector(".menu-btn");
const nav=document.querySelector("nav");

menu.onclick=()=>nav.classList.toggle("show");



let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

const container = document.getElementById("favoritesList");


if(favorites.length === 0){

container.innerHTML = `
<h2 style="color:white;">
لا توجد كوميكس في المفضلة
</h2>
`;

}else{


favorites.forEach(comic=>{


container.innerHTML += `

<a href="comic.html?comic=${comic.folder}" class="comic-link">

<div class="card">


<div class="cover">


<img src="${comic.cover}" alt="${comic.title}">


<div class="favorite-mark">
💛
</div>


</div>


<h3>
${comic.title}
</h3>


</div>


</a>

`;


});


}


</script>



</body>

</html>
