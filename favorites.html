<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>المفضلة - SamBox</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>
    <h2>💛 المفضلة</h2>
</header>


<main>

<div id="favoritesContainer" class="comics-grid"></div>

</main>



<script>

let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

const container = document.getElementById("favoritesContainer");


if(favorites.length === 0){

    container.innerHTML = "<h2>لا توجد كوميكس في المفضلة</h2>";

}else{


favorites.forEach(comic => {


container.innerHTML += `

<div class="comic-card">

<img src="${comic.cover}" class="cover">

<h3>${comic.title}</h3>

<a href="comic.html?comic=${comic.title}">
فتح الكوميك
</a>

</div>

`;


});


}


</script>


</body>

</html>
