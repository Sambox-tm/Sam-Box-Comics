<h1>سياسة الخصوصية</h1>

<!-- مقدمة
نحن في SamBox نحترم خصوصيتك ونلتزم بحماية بياناتك الشخصية. توضح سياسة الخصوصية هذه كيفية جمعنا واستخدامنا وحمايتنا لمعلوماتك الشخصية عند استخدام موقعنا الإلكتروني وخدماتنا.

يرجى قراءة سياسة الخصوصية هذه بعناية لفهم نهجنا واستخدامنا للبيانات الشخصية.

المعلومات التي نجمعها
قد نقوم بجمع أنواع مختلفة من المعلومات الشخصية منك، بما في ذلك:

معلومات التعريف الشخصية: مثل الاسم وعنوان البريد الإلكتروني ورقم الهاتف عند التسجيل في موقعنا أو الاشتراك في النشرة الإخبارية.
معلومات الاستخدام: بيانات حول كيفية استخدامك لموقعنا وخدماتنا، مثل الصفحات التي تزورها ووقت الزيارة والمحتوى الذي تتفاعل معه.
معلومات الجهاز: بيانات حول جهازك مثل نوع المتصفح ونظام التشغيل وعنوان IP.
ملفات تعريف الارتباط (كوكيز): نستخدم ملفات تعريف الارتباط لتحسين تجربة المستخدم وجمع إحصائيات الموقع.
كيفية استخدام معلوماتك
نستخدم المعلومات التي نجمعها للأغراض التالية:

توفير وتحسين خدماتنا ومحتوانا.
التواصل معك بشأن تحديثات الموقع والمحتوى الجديد.
الرد على استفساراتك وطلبات الدعم.
تخصيص تجربتك وإظهار محتوى مناسب لاهتماماتك.
تحليل اتجاهات الاستخدام وتحسين أداء موقعنا.
اكتشاف ومنع الاحتيال والأنشطة غير المصرح بها.
مشاركة معلوماتك
نحن لا نبيع أو نؤجر معلوماتك الشخصية لأطراف ثالثة. ومع ذلك، قد نشارك معلوماتك في الحالات التالية:

مع مزودي الخدمات الذين يساعدوننا في تشغيل موقعنا وتقديم خدماتنا (مثل خدمات الاستضافة ومعالجة المدفوعات).
عندما يكون ذلك مطلوبًا بموجب القانون أو للامتثال للإجراءات القانونية.
لحماية حقوقنا أو ممتلكاتنا أو سلامة مستخدمينا أو الجمهور.
في حالة عملية دمج أو استحواذ أو بيع لأصول الشركة.
أمان البيانات
نحن نتخذ تدابير أمنية مناسبة لحماية معلوماتك الشخصية من الوصول غير المصرح به أو التعديل أو الإفصاح أو التدمير. ومع ذلك، لا يمكن ضمان أمان البيانات المرسلة عبر الإنترنت بنسبة 100٪، لذا في حين أننا نبذل قصارى جهدنا لحماية معلوماتك، لا يمكننا ضمان أمانها المطلق.

حقوقك
تمتلك حقوقًا معينة فيما يتعلق بمعلوماتك الشخصية، وتشمل:

الوصول إلى معلوماتك الشخصية التي نحتفظ بها.
تصحيح أي معلومات غير دقيقة أو غير كاملة.
طلب حذف معلوماتك الشخصية في ظروف معينة.
الاعتراض على معالجة معلوماتك لأغراض تسويقية.
سحب موافقتك على معالجة معلوماتك عندما تكون المعالجة قائمة على الموافقة.
ملفات تعريف الارتباط (كوكيز)
نستخدم ملفات تعريف الارتباط لتحسين تجربتك على موقعنا. يمكنك إدارة تفضيلات ملفات تعريف الارتباط من خلال إعدادات المتصفح الخاص بك، ولكن قد يؤثر تعطيلها على بعض وظائف موقعنا.

التغييرات على سياسة الخصوصية
قد نقوم بتحديث سياسة الخصوصية هذه من وقت لآخر. سنخطرك بأي تغييرات جوهرية من خلال نشر السياسة المحدثة على موقعنا وتغيير تاريخ "آخر تحديث". نشجعك على مراجعة سياسة الخصوصية بانتظام للبقاء على اطلاع بكيفية حمايتنا لمعلوماتك. -->
